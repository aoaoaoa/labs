<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="page-title" content="On Digital Audiences, 2026"><title>On Digital Audiences, 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap"><style>
:root{--paper:#f5f1e8;--bar:#fdfcf9;--cream:#f7f2ea;--ink:#1d1a16;--mute:#6a635a;--rule:#d9d2c4;--accent:#1b5e6b;--f1:#1b5e6b;--f2:#8a3a1e;--f3:#3b3f7a;--f4:#2f5d3a;--hi:#8a3a1e;--md:#8b6a1a;--lo:#6a635a;--disp:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--text:Literata,Georgia,serif}

:root[data-theme="dark"]{--paper:#15130f;--bar:#221e19;--cream:#1c1915;--ink:#efe9dd;--mute:#a39b8e;--rule:#2f2a22;--accent:#7fc0c9;--f1:#7fc0c9;--f2:#e39a7a;--f3:#a9adf0;--f4:#8fc79d;--hi:#e39a7a;--md:#d9b25a;--lo:#a39b8e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 var(--text)}

.fn{font:13px/1.5 var(--disp);color:var(--mute);margin:8px 0 0}
.pri{display:inline-block;font:600 11px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.p-high{color:var(--hi)}.p-medium,.p-medium-low,.p-low-medium{color:var(--md)}.p-low{color:var(--lo)}

.dl{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:10px 20px;margin:0}.dl dt{font:700 13px/1.5 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.dl dd{margin:0;font-size:16.5px;line-height:1.55}

summary{cursor:pointer}summary:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* R1 */
.r1{max-width:1180px;margin:0 auto;padding:72px 0 96px}

/* R2 */
.r2{max-width:1240px;margin:0 auto;padding:56px 0 96px}
.r2 .hero{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;padding-bottom:40px;border-bottom:1px solid var(--rule)}.r2 .hero>div:first-child{flex:999 1 480px;min-width:0}
.r2 h1{font-size:clamp(52px,9vw,124px);line-height:.88;letter-spacing:-.045em;margin:12px 0 22px;font-weight:800}.r2 .dek{font-size:19px;max-width:52ch;margin:0}

.r2 .rg{border:1.5px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;font:12px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.r2 .rg q{font:600 18px/1.3 var(--disp);letter-spacing:-.01em;text-transform:none;color:var(--ink)}.r2 .rg.in{background:var(--ink);border-color:var(--ink)}.r2 .rg.in q{color:var(--paper)}.r2 .rg.in span{color:var(--rule)}
.r2 .arr{align-self:center;font:700 22px var(--disp)}
.r2 .sum{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px 40px;padding:36px 0;border-bottom:1px solid var(--rule)}.r2 .sum p{margin:0;max-width:72ch;font-size:17.5px}

.r2 .flt{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:18px;font-family:var(--disp)}.r2 .flt [role=group]{display:flex;flex-wrap:wrap;gap:8px}
.r2 .flt button{font:600 14px var(--disp);border:1.5px solid var(--rule);background:var(--bar);color:var(--ink);border-radius:999px;padding:0 14px;min-height:40px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}.r2 .flt button i{width:10px;height:10px;border-radius:50%;background:var(--fc)}.r2 .flt button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.r2 .flt label{font-size:14px;display:flex;gap:8px;align-items:center}.r2 select{font:600 14px var(--disp);min-height:40px;border-radius:999px;border:1.5px solid var(--rule);background:var(--bar);color:var(--ink);padding:0 12px}

.r2 .pc .top{display:flex;gap:10px;align-items:center}.r2 .pc .fam{font:12px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.r2 .pc b{font:700 21px/1.15 var(--disp);letter-spacing:-.01em}.r2 .pc .tg{font-size:15.5px;line-height:1.45}.r2 .pc .via{margin-top:auto;font:13px var(--disp);color:var(--mute);padding-top:8px;border-top:1px solid var(--rule)}
.r2 .mxw{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--bar)}.r2 .mx{border-collapse:collapse;width:100%;font:14px var(--disp)}.r2 .mx th,.r2 .mx td{border-bottom:1px solid var(--rule);padding:10px 8px;text-align:center}.r2 .mx tbody th{text-align:left;white-space:nowrap;font-weight:700}.r2 .mx .pn{display:flex;gap:10px;align-items:center;justify-content:space-between}
.r2 .mx thead th span{color:var(--fc);font-weight:800}.r2 .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--fc)}
.r2 .plc{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px 32px;margin-top:28px}.r2 .plc h3{margin:0;font-size:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.r2 .plc p{margin:6px 0 0;font-size:16px}.r2 .plc .ft{color:var(--mute)}
.r2 .ins2{list-style:none;margin:0;padding:0;columns:2 420px;column-gap:40px}.r2 .ins2 li{break-inside:avoid;border-top:1px solid var(--rule)}.r2 .ins2 summary{list-style:none;display:flex;gap:14px;padding:14px 0;font:700 17px/1.3 var(--disp)}.r2 .ins2 summary::-webkit-details-marker{display:none}.r2 .ins2 .no{color:var(--accent);flex:none}.r2 .ins2 p{margin:0 0 16px;font-size:16px}.r2 .ins2 .bars{margin-bottom:16px}
.r2 .end3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;border-top:2px solid var(--ink);margin-top:56px}.r2 .end3 h2{font-size:22px;margin:0 0 10px}.r2 .end3 p{font-size:16px;margin:0 0 12px}
.r2 .pd{max-width:720px;width:calc(100% - 32px);border:0;border-radius:14px;padding:28px;background:var(--bar);color:var(--ink)}.r2 .pd::backdrop{background:rgba(20,18,15,.55)}.r2 .pd h2{margin:6px 0 6px;font-size:30px;line-height:1.1}.r2 .pd .ft{color:var(--mute);margin:0 0 18px}.r2 .pd .via{font:14px var(--disp);color:var(--mute);border-top:1px solid var(--rule);padding-top:12px}

/* R3 */
.r3{max-width:1240px;margin:0 auto;padding:40px 0 96px}

.r3 .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}.r3 .charts figure{margin:0;background:var(--bar);border:1px solid var(--rule);padding:18px}.r3 figcaption{font:700 15px var(--disp);margin-bottom:14px}
.r3 section{margin-top:48px}.r3 h2{font-size:24px;margin:0 0 14px;font-weight:800}.r3 .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px}.r3 .two p{font-size:16.5px;margin:0 0 16px}

.r3 .pt td:nth-child(3){min-width:220px;color:var(--mute)}.r3 .pt summary .tg{color:var(--mute);font-weight:400}.r3 .pt .dl{margin:12px 0 6px;font-family:var(--text)}
.r3 .plt td .cd{margin:0 4px 4px 0}.r3 .plt td:last-child{min-width:200px;white-space:nowrap}.r3 .plt .bt{display:inline-block;width:120px;vertical-align:middle;margin-right:8px}.r3 .mu,.r3 .mu2{color:var(--mute)}.r3 .mu2{font-size:16px;max-width:80ch}
.r3 .ev3 dd{font-size:15.5px}

.go{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper)!important;text-decoration:none;font:700 15px var(--disp);margin-top:24px}
.go.ghost{background:transparent;color:var(--ink)!important;border:1.5px solid var(--ink)}
.r1 .atl{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;background:var(--cream);border:1px solid var(--rule);padding:18px 20px;margin:0 0 28px}.r1 .atl p{margin:0;font-size:16.5px;max-width:52ch}.r1 .atl .go{margin:0}
.r2 .back{display:inline-flex;gap:8px;font:600 14px var(--disp);color:var(--ink);text-decoration:none;margin-bottom:28px}

.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.gate form{width:100%;max-width:420px;background:var(--bar);border:1px solid var(--rule);border-radius:14px;padding:32px;display:flex;flex-direction:column;gap:14px}
.gate h1{margin:4px 0 6px;font:800 34px/1 var(--disp);letter-spacing:-.03em}
.gate label{font:600 14px var(--disp)}.gate input{font:16px var(--disp);min-height:48px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);padding:0 14px;width:100%}
