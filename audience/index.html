*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 var(--text)}

/* R1 */

.r2 h1{font-size:clamp(52px,9vw,124px);line-height:.88;letter-spacing:-.045em;margin:12px 0 22px;font-weight:800}.r2 .dek{font-size:19px;max-width:52ch;margin:0}

.r2 .mxw{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--bar)}.r2 .mx{border-collapse:collapse;width:100%;font:14px var(--disp)}.r2 .mx th,.r2 .mx td{border-bottom:1px solid var(--rule);padding:10px 8px;text-align:center}.r2 .mx tbody th{text-align:left;white-space:nowrap;font-weight:700}.r2 .mx .pn{display:flex;gap:10px;align-items:center;justify-content:space-between}

.go{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper)!important;text-decoration:none;font:700 15px var(--disp);margin-top:24px}

.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
